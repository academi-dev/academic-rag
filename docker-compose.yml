version: "3.8"

services:
  academic-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academic-rag-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - LLM_PROVIDER=local
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - UPLOAD_DIR=/app/uploads
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./chroma_db:/app/chroma_db
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
